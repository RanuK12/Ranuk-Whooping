<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05080E"/>
      <stop offset="50%" stop-color="#0B1320"/>
      <stop offset="100%" stop-color="#04060A"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BD00FF"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F59B"/>
      <stop offset="60%" stop-color="#00D2FF"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="outerGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur"/>
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="506" height="506" x="3" y="3" rx="109" fill="none" stroke="url(#ringGrad)" stroke-width="2.5" stroke-opacity="0.4"/>

  <!-- Background Ambient Glows -->
  <circle cx="140" cy="140" r="90" fill="#00F59B" opacity="0.12" filter="url(#outerGlow)"/>
  <circle cx="370" cy="370" r="90" fill="#BD00FF" opacity="0.12" filter="url(#outerGlow)"/>

  <!-- Outer Recovery Ring (95% Arc) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#1E293B" stroke-width="12" opacity="0.3"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#ringGrad)" stroke-width="14" stroke-linecap="round"
          stroke-dasharray="1130" stroke-dashoffset="60" filter="url(#glow)"/>

  <!-- Inner Strain Ring Arc -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#00D2FF" stroke-width="6" stroke-linecap="round"
          stroke-dasharray="942" stroke-dashoffset="400" opacity="0.6"/>

  <!-- DNA Longevity Helix & ECG Heartbeat Wave -->
  <g filter="url(#glow)">
    <!-- Pulse Line -->
    <path d="M 120 256 L 180 256 L 205 200 L 230 330 L 265 140 L 295 360 L 320 220 L 340 270 L 392 256"
          fill="none" stroke="url(#neonGreen)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- DNA Node Circles -->
    <circle cx="205" cy="200" r="8" fill="#00F59B"/>
    <circle cx="230" cy="330" r="8" fill="#00D2FF"/>
    <circle cx="265" cy="140" r="11" fill="#FFFFFF"/>
    <circle cx="295" cy="360" r="9" fill="#A855F7"/>
    <circle cx="320" cy="220" r="7" fill="#00D2FF"/>
  </g>

  <!-- Central "BIOSPAN 5.0" Monogram Typography -->
  <text x="256" y="420" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif"
        font-size="28" font-weight="900" fill="#FFFFFF" letter-spacing="6">RANUK</text>
  <text x="256" y="445" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', sans-serif"
        font-size="16" font-weight="800" fill="#00F59B" letter-spacing="4">BIOSPAN 5.0</text>
</svg>
